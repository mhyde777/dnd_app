# Builds and publishes a complete release when a version tag is pushed.
#
# WHY: PyInstaller cannot cross-compile, so a release used to mean building on
# two machines by hand -- cut it on Linux, then remember to boot Windows and
# run package_WIN.sh --publish against the same tag. Forgetting the second half
# published a release that looked finished but left every Windows user's
# updater reporting "no build for this system" (see docs/updating-windows.md).
#
# Here both platforms build in parallel from the same tag and the release is
# created only once both have succeeded, so a half-published release is not a
# state that can be reached.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true

permissions:
  contents: write

jobs:
  # Cheap checks first. A tag is public the moment it is pushed, but a release
  # is not -- so everything that can be caught before any artifact exists is
  # caught here.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Read the version and check it matches the tag
        id: version
        run: |
          # Read as text, never by importing: an import can be served from a
          # stale __pycache__ entry, since Python validates bytecode on the
          # source's mtime in whole seconds and its size. That has already
          # produced artifacts named after a version that did not exist.
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' lib/app/version.py | tr -d '\r')"
          [ -n "$VERSION" ] || { echo "::error::no __version__ in lib/app/version.py"; exit 1; }

          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match version.py ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --dev --deploy

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pipenv run python -m pytest tests/ -q

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # squashfs-tools builds the AppImage image; the Qt libraries are needed
      # because PyInstaller imports the app to trace it.
      - name: Install build and Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools desktop-file-utils \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --dev --deploy

      - name: Build
        run: ./package.sh

      # Fail here rather than publishing a release that is missing the download
      # most Linux users are meant to take.
      - name: Check the artifacts exist
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          for f in "dist/combat-tracker-$VERSION-linux-x86_64.tar.gz" \
                   "dist/combat-tracker-$VERSION-linux-x86_64.AppImage" \
                   "dist/foundryvtt-bridge.zip" "dist/module.json"; do
            [ -s "$f" ] || { echo "::error::missing or empty: $f"; exit 1; }
          done
          # The AppImage must be executable in the artifact, but a zipped
          # upload artifact does not preserve the bit -- the release job sets
          # it again after download. Checked here so a build that produced a
          # non-executable file is still caught.
          [ -x "dist/combat-tracker-$VERSION-linux-x86_64.AppImage" ] \
            || { echo "::error::AppImage is not executable"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/foundryvtt-bridge.zip
            dist/module.json
          if-no-files-found: error

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ISCC is not on PATH by default; package_WIN.sh looks in both standard
      # install locations as well, so no PATH surgery is needed here.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --dev --deploy

      - name: Build
        shell: bash
        run: ./package_WIN.sh

      - name: Check the artifacts exist
        shell: bash
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          for f in "dist/combat-tracker-$VERSION-windows-x64.zip" \
                   "dist/combat-tracker-$VERSION-windows-x64-setup.exe"; do
            [ -s "$f" ] || { echo "::error::missing or empty: $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  release:
    needs: [verify, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          mkdir -p release
          # foundryvtt-bridge.zip comes from the Linux job only; both jobs
          # produce a *.zip, so copy by explicit name rather than globbing
          # everything into one directory and hoping.
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.AppImage' \
               -o -name '*.zip' -o -name '*-setup.exe' -o -name 'module.json' \) \
               -exec cp -n {} release/ \;

          # The upload-artifact round trip drops the executable bit, and an
          # AppImage that arrives non-executable is one a user cannot run by
          # double-clicking -- which is the entire point of shipping one.
          chmod +x release/*.AppImage

          # Regenerated over the finished set rather than merging the two
          # per-platform files: this is the only listing that covers every
          # artifact actually being published, and it is the sole integrity
          # check a user has for the unsigned Windows installer.
          ( cd release && sha256sum * > SHA256SUMS )
          ls -l release
          cat release/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${{ needs.verify.outputs.version }}"

          # This version's section of the changelog, from its heading to the
          # next one. Written to a file rather than piped in: an empty
          # --notes-file makes gh fail, and finding that out mid-publish is the
          # worst moment for it.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "::warning::no CHANGELOG section for $VERSION; using generated notes"
            NOTES_ARG="--generate-notes"
          else
            NOTES_ARG="--notes-file notes.md"
          fi

          # Created as a draft, uploaded, then published -- so the release is
          # never publicly visible in a state where the assets are missing.
          # --clobber lets a re-run repair a partial release rather than fail.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --verify-tag --draft $NOTES_ARG
          fi
          gh release upload "$TAG" release/* --clobber

          # Published last, once every asset is attached. A release that goes
          # public with no files on it looks exactly like a finished one, and
          # the in-app updater reports "no build for this system".
          gh release edit "$TAG" --draft=false

      - name: Confirm the assets are really attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${{ needs.verify.outputs.version }}"
          NAMES="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$NAMES"
          for expected in \
            "combat-tracker-$VERSION-linux-x86_64.tar.gz" \
            "combat-tracker-$VERSION-linux-x86_64.AppImage" \
            "combat-tracker-$VERSION-windows-x64.zip" \
            "combat-tracker-$VERSION-windows-x64-setup.exe" \
            "foundryvtt-bridge.zip" "module.json" "SHA256SUMS"; do
            echo "$NAMES" | grep -qx "$expected" \
              || { echo "::error::$expected did not attach to $TAG"; exit 1; }
          done
